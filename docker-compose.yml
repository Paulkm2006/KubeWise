services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # LLM — set these before running, or mount a config file
      KUBEWISE_LLM_API_KEY: ${KUBEWISE_LLM_API_KEY:-}
      KUBEWISE_LLM_MODEL: ${KUBEWISE_LLM_MODEL:-glm-5.1}
      KUBEWISE_LLM_API_BASE: ${KUBEWISE_LLM_API_BASE:-https://open.bigmodel.cn/api/paas/v4/}
      KUBEWISE_LOG_LEVEL: ${KUBEWISE_LOG_LEVEL:-info}
    volumes:
      # Mount kubeconfig so the backend can talk to your K8s cluster
      - ${HOME}/.kube/config:/root/.kube/config:ro
      # Persist session data across restarts
      - kubewise-data:/root/.kubewise
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  kubewise-data:
