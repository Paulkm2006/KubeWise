openapi: 3.0.3
info:
  title: KubeWise API
  description: Kubernetes intelligent operations agent system REST API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/chat:
    post:
      summary: Synchronous chat query
      description: Send a natural language query and receive the final result synchronously.
      operationId: chatSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chat/stream:
    get:
      summary: SSE streaming chat query
      description: |
        Send a natural language query and receive real-time Server-Sent Events as the agent processes it.
        The stream ends with a `stream_done` or `stream_err` event.
      operationId: chatStream
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: The natural language query
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream. Each event has:
                  ```
                  event: <type>
                  data: <json>
                  ```

                  Event types and their data shapes:

                  - `phase` → `{"query_id":"...","phase":"thinking"}`
                  - `agent_start` → `{"query_id":"...","agent_name":"Query Agent"}`
                  - `agent_done` → `{"query_id":"...","duration_ns":123,"in_tokens":10,"out_tokens":50}`
                  - `tool_call` → `{"query_id":"...","tool_name":"get_pods","step":1}`
                  - `tool_done` → `{"query_id":"...","tool_name":"get_pods","step":1,"elapsed_ns":500000000}`
                  - `tool_fail` → `{"query_id":"...","tool_name":"get_pods","step":1,"elapsed_ns":500000000,"error":"timeout"}`
                  - `render_text` → `{"query_id":"...","text":"hello"}`
                  - `render_table` → `{"query_id":"...","headers":["Name"],"rows":[["pod-a"]]}`
                  - `render_code` → `{"query_id":"...","language":"yaml","content":"..."}`
                  - `render_kv` → `{"query_id":"...","pairs":[{"key":"ns","value":"default"}]}`
                  - `render_list` → `{"query_id":"...","items":[{"status":"ok","text":"pod running"}]}`
                  - `render_detail` → `{"query_id":"...","detail":{"kind":"pod","name":"my-pod","namespace":"default",...}}`
                  - `llm_text_delta` → `{"query_id":"...","delta":"思考中"}`
                  - `supervisor` → `{"query_id":"...","reason":"loop detected","decision":"interrupt","detail":"..."}`
                  - `interaction_request` → see InteractionRequestData schema below
                  - `stream_done` → `{"query_id":"...","result":"..."}`
                  - `stream_err` → `{"query_id":"...","error":"..."}`
        "400":
          description: Missing query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/chat/interaction:
    post:
      summary: Answer human-in-the-loop interaction
      description: |
        Respond to an `interaction_request` SSE event. The agent is blocked until this endpoint is called.
        Payload shape depends on `kind` in the SSE event (e.g. `operation_step`, `chart_select`, `deploy_confirm`).
      operationId: chatInteraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionAnswerRequest"
      responses:
        "200":
          description: Response accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: interaction_id not found or already responded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Agent no longer waiting for interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/sessions:
    get:
      summary: List sessions
      operationId: listSessions
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionListResponse"
    post:
      summary: Create session
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /api/v1/sessions/{id}:
    get:
      summary: Get session detail
      operationId: getSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetailResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete session
      operationId: deleteSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: dev

    ChatRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: Natural language query
          example: "列出所有命名空间"
        query_id:
          type: string
          description: Optional client-supplied query ID

    ChatResponse:
      type: object
      properties:
        query_id:
          type: string
        result:
          type: string

    InteractionAnswerRequest:
      type: object
      required:
        - interaction_id
      properties:
        interaction_id:
          type: string
          description: ID from the interaction_request SSE event
        payload:
          oneOf:
            - $ref: "#/components/schemas/OperationStepPayload"
            - $ref: "#/components/schemas/ChartSelectPayload"
            - $ref: "#/components/schemas/DeployConfirmPayload"
          description: |
            Kind-specific JSON body:

            - `operation_step` → `{"confirmed":true}` or `{"confirmed":false,"correction":"改成3个副本"}`
            - `chart_select` → `{"cancelled":true}` or `{"use_manual_chart":false,"candidate_index":0}`
            - `deploy_confirm` → `{"action":"execute"}` or `{"action":"cancel"}` or `{"action":"execute","values":"...","correction":"..."}`

    CreateSessionRequest:
      type: object
      properties:
        title:
          type: string

    SessionResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        message_count:
          type: integer

    SessionDetailResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    SessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionResponse"

    Message:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string

    # --- SSE Event Data Schemas ---

    InteractionRequestData:
      type: object
      properties:
        query_id:
          type: string
        interaction_id:
          type: string
        kind:
          type: string
          enum: [operation_step, chart_select, deploy_confirm]
        payload:
          type: object
          description: Opaque JSON; see kind-specific schemas
        total_steps:
          type: integer
          description: Only for operation_step

    OperationStepPayload:
      type: object
      properties:
        confirmed:
          type: boolean
        correction:
          type: string

    ChartSelectPayload:
      type: object
      properties:
        cancelled:
          type: boolean
        use_manual_chart:
          type: boolean
        candidate_index:
          type: integer

    DeployConfirmPayload:
      type: object
      properties:
        action:
          type: string
          enum: [execute, cancel]
        values:
          type: string
        correction:
          type: string

    DetailPayload:
      type: object
      properties:
        kind:
          type: string
        name:
          type: string
        namespace:
          type: string
        status:
          type: object
          additionalProperties:
            type: string
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerInfo"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/ConditionInfo"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventInfo"
        recent_logs:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string

    ContainerInfo:
      type: object
      properties:
        name:
          type: string
        image:
          type: string
        ready:
          type: boolean
        restart_count:
          type: integer
        state:
          type: string

    ConditionInfo:
      type: object
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string

    EventInfo:
      type: object
      properties:
        type:
          type: string
        reason:
          type: string
        message:
          type: string
        timestamp:
          type: string
