          type: string
          description: 事件摘要。
        detail:
          type: string
          description: 事件详细信息。
        payload_kind:
          type: string
          description: 事件载荷类型。
        payload_json:
          type: string
          description: JSON 字符串形式的事件载荷。
        elapsed_ms:
          type: integer
          description: 本步骤耗时，单位毫秒。
        created_at:
          type: integer
          format: int64
          description: 事件创建时间戳。

    AuditResult:
      type: object
