# KubeWise 配置文件示例
# 复制到 ~/.kubewise.yaml 即可使用

# Kubernetes配置文件路径，不填则默认使用 ~/.kube/config
kubeconfig: "~/.kube/config"

# LLM相关配置
llm:
  # 模型名称，支持 glm-5.1、qwen3、gpt-4o 等兼容OpenAI API的模型
  model: "glm-5.1"
  # API Key
  api_key: "your-api-key-here"
  # API Base URL，对于国产模型需要填写对应的API地址
  # 智谱AI: https://open.bigmodel.cn/api/paas/v4/
  # 通义千问: https://dashscope.aliyuncs.com/compatible-mode/v1
  # DeepSeek: https://api.deepseek.com/v1
  api_base: "https://open.bigmodel.cn/api/paas/v4/"

# Agent相关配置
agent:
  # 最大工具调用轮次，默认20。复杂查询可能需要更多轮次
  # 也可通过环境变量 KUBEWISE_AGENT_MAX_STEPS 或 --max-steps 参数设置
  max_steps: 20

  # Supervisor自动干预配置
  # 当agent陷入循环或达到max_steps时，supervisor会评估是否继续、重置或终止
  # 可通过 --no-supervisor 参数禁用
  supervisor:
    enabled: true
    # 相同工具+参数连续调用N次后触发检测（默认3）
    repeat_threshold: 3
    # 两个工具交替调用A-B-A-B N次后触发检测（默认3）
    ping_pong_threshold: 3
    # 同一工具名连续调用N次后触发检测（默认5）
    same_tool_threshold: 5
    # 最大继续授权次数（默认2）
    max_extensions: 2
    # 每次继续授权额外给多少步（默认10）
    extension_step_grant: 10
    # 最大LLM评估调用次数（默认2）
    max_evaluator_calls: 2
