<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KubeWise — K8s 指挥中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-root: #09090b; --bg-surface: #0f0f16; --bg-elevated: #15151f;
      --bg-glass: rgba(15, 15, 22, 0.85); --border: #1e1e2c; --border-active: #2a2a3c;
      --cyan: #00e5ff; --cyan-dim: rgba(0, 229, 255, 0.08);
      --amber: #ffab00; --amber-dim: rgba(255, 171, 0, 0.08);
      --green: #00e676; --green-dim: rgba(0, 230, 118, 0.08);
      --red: #ff5252; --red-dim: rgba(255, 82, 82, 0.08);
      --violet: #b388ff; --violet-dim: rgba(179, 136, 255, 0.08);
      --text: #c8ccd4; --text-secondary: #747a88; --text-tertiary: #4a5060; --text-muted: #2a2e38;
      --font-mono: 'JetBrains Mono', monospace; --font-sans: 'DM Sans', sans-serif;
      --sidebar-w: 288px; --header-h: 44px; --radius: 3px; --radius-md: 6px;
    }
    html, body { height: 100%; }
    body {
      font-family: var(--font-sans); background: var(--bg-root); color: var(--text);
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 999; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.015) 2px, rgba(0,0,0,0.015) 4px);
    }
    .app { display: flex; height: 100vh; position: relative; z-index: 1; }

    .sidebar { width: var(--sidebar-w); background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-brand { height: var(--header-h); display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--text); flex-shrink: 0; }
    .brand-mark { width: 20px; height: 20px; border: 1.5px solid var(--cyan); border-radius: var(--radius); position: relative; display: flex; align-items: center; justify-content: center; }
    .brand-mark::before, .brand-mark::after { content: ''; position: absolute; background: var(--cyan); }
    .brand-mark::before { width: 10px; height: 1.5px; }
    .brand-mark::after { width: 1.5px; height: 10px; }
    .brand-dot { width: 3px; height: 3px; background: var(--cyan); border-radius: 50%; z-index: 1; }
    .sidebar-section { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sidebar-label { font-family: var(--font-mono); font-size: 8px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 8px; }

    /* Cluster Status */
    #healthBar { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: var(--radius); margin-bottom: 8px; background: rgba(0,230,118,0.04); border: 1px solid rgba(0,230,118,0.08); }
    #healthBar.warning { background: var(--amber-dim); border-color: rgba(255,171,0,0.08); }
    #healthBar.critical, #healthBar.offline { background: var(--red-dim); border-color: rgba(239,68,68,0.08); }
    #healthDot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; display: inline-block; }
    #healthDot.warning { background: var(--amber); }
    #healthDot.critical, #healthDot.offline { background: var(--red); }
    #healthLabel { font-family: var(--font-mono); font-size: 9px; font-weight: 600; }
    #healthBar.offline #healthLabel, #healthBar.critical #healthLabel { color: var(--red); }
    #healthBar.warning #healthLabel { color: var(--amber); }
    #healthBar:not(.warning):not(.critical):not(.offline) #healthLabel { color: var(--green); }
    #healthVersion { font-size: 8px; color: var(--text-tertiary); margin-left: auto; }
    .cluster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .cluster-card { padding: 6px 8px; border-radius: var(--radius); background: rgba(255,255,255,0.015); border: 1px solid var(--border); }
    .cluster-card-value { font-family: var(--font-mono); font-size: 13px; font-weight: 600; color: var(--text); }
    .cluster-card-label { font-size: 8px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 1px; }

    .agent-list { flex: 1; overflow-y: auto; padding: 6px 8px; }
    .agent-list::-webkit-scrollbar { width: 3px; }
    .agent-list::-webkit-scrollbar-track { background: transparent; }
    .agent-list::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }
    .agent-card { padding: 8px 10px; border-radius: var(--radius); margin-bottom: 2px; cursor: default; transition: background 0.2s; border: 1px solid transparent; }
    .agent-card:hover { background: rgba(255,255,255,0.02); }
    .agent-card.active { background: var(--cyan-dim); border-color: rgba(0, 229, 255, 0.1); }
    .agent-card-row { display: flex; align-items: center; gap: 8px; }
    .agent-indicator { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; transition: all 0.3s; display: inline-block; }
    .agent-indicator.idle { background: var(--text-muted); }
    .agent-indicator.busy { background: var(--amber); box-shadow: 0 0 6px rgba(255,171,0,0.4); }
    .agent-indicator.done { background: var(--green); box-shadow: 0 0 4px rgba(0,230,118,0.3); }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.7); } }
    .agent-indicator.busy { animation: pulse 1s ease-in-out infinite; }
    .status-dot.busy { animation: pulse 0.8s ease-in-out infinite; }
    .agent-name { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--text); flex: 1; }
    .agent-latency { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
    .agent-card.active .agent-latency { color: var(--cyan); }
    .agent-meta { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; padding-left: 14px; }
    .sidebar-footer { padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .btn-new-session { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); background: transparent; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; transition: all 0.2s; }
    .btn-new-session:hover { border-color: var(--border-active); color: var(--text-secondary); background: rgba(255,255,255,0.02); }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-root); }
    .main-header { height: var(--header-h); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg-glass); backdrop-filter: blur(8px); z-index: 2; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-path { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.02em; }
    .header-path span { color: var(--cyan); }
    .header-status { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.03em; padding: 3px 10px; border-radius: 100px; background: var(--green-dim); border: 1px solid rgba(0, 230, 118, 0.1); color: var(--text-secondary); transition: all 0.3s; }
    .header-status.busy { background: var(--amber-dim); border-color: rgba(255, 171, 0, 0.1); }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); display: inline-block; }
    .header-right { display: flex; align-items: center; gap: 2px; }
    .header-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; width: 28px; height: 28px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 13px; transition: all 0.2s; }
    .header-btn:hover { color: var(--text-secondary); background: rgba(255,255,255,0.03); }

    .messages-wrap { flex: 1; position: relative; overflow: hidden; }
    .messages { position: absolute; inset: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 2px; }
    .msg { display: flex; gap: 10px; max-width: 780px; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }
    .msg-avatar { width: 26px; height: 26px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-elevated); }
    .msg.user .msg-avatar { border-color: rgba(0, 229, 255, 0.12); color: var(--cyan); }
    .msg.agent .msg-avatar { color: var(--text-secondary); }
    .msg-body { display: flex; flex-direction: column; gap: 4px; }
    .msg-meta { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; }
    .msg-agent-tag { font-weight: 500; padding: 1px 6px; border-radius: 2px; font-size: 9px; letter-spacing: 0.03em; }
    .msg-agent-tag.query { color: var(--cyan); background: var(--cyan-dim); }
    .msg-agent-tag.operation { color: var(--amber); background: var(--amber-dim); }
    .msg-agent-tag.troubleshooting { color: var(--green); background: var(--green-dim); }
    .msg-agent-tag.security { color: var(--red); background: var(--red-dim); }
    .msg-agent-tag.deploy { color: var(--violet); background: var(--violet-dim); }
    .msg-time { color: var(--text-muted); }
    .msg-bubble { padding: 10px 16px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.7; white-space: pre-wrap; }
    .msg.user .msg-bubble { background: rgba(0, 229, 255, 0.04); border: 1px solid rgba(0, 229, 255, 0.08); border-bottom-right-radius: 1px; }
    .msg.agent .msg-bubble { background: var(--bg-elevated); border: 1px solid var(--border); border-bottom-left-radius: 1px; color: var(--text-secondary); }
    .msg-bubble.streaming { border-left: 2px solid var(--cyan); }
    .streaming-cursor { display: inline; animation: blink 0.7s step-end infinite; color: var(--cyan); }
    @keyframes blink { 50% { opacity: 0; } }
    .msg-bubble strong { color: var(--text); font-weight: 600; }
    .msg-bubble code { font-family: var(--font-mono); font-size: 11px; background: rgba(0,0,0,0.4); padding: 1px 6px; border-radius: 2px; color: var(--cyan); border: 1px solid rgba(0, 229, 255, 0.08); }
    .msg-bubble pre { margin: 10px 0; padding: 12px 14px; background: rgba(0,0,0,0.4); border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.03); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.55; overflow-x: auto; color: var(--text); }
    .msg-bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 11px; }
    .msg-bubble table th, .msg-bubble table td { padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
    .msg-bubble table th { background: rgba(0,0,0,0.2); color: var(--cyan); font-weight: 600; font-family: var(--font-mono); font-size: 10px; }
    .msg-bubble table td { color: var(--text-secondary); font-size: 10.5px; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin: 6px 0; }
    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 { margin: 12px 0 6px; color: var(--text); font-weight: 600; }
    .msg-bubble blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--cyan); color: var(--text-tertiary); background: rgba(0,229,255,0.03); border-radius: 0 var(--radius) var(--radius) 0; }

    .tool-calls { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
    .tool-item { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); padding: 3px 10px; background: rgba(0,0,0,0.2); border-radius: 2px; border-left: 2px solid var(--cyan); transition: all 0.3s; }
    .tool-item.done { border-left-color: var(--green); color: var(--text-secondary); }
    .tool-item.failed { border-left-color: var(--red); }
    .tool-check { color: var(--green); font-weight: 600; }

    .thinking { display: flex; align-items: center; gap: 10px; padding: 8px 24px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .thinking.show { opacity: 1; }
    .thinking-indicator { display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 100px; background: rgba(0, 229, 255, 0.03); border: 1px solid rgba(0, 229, 255, 0.06); }
    .thinking-dots { display: flex; gap: 3px; }
    .thinking-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--cyan); animation: think-pulse 1.2s ease-in-out infinite; }
    .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes think-pulse { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.15; } 40% { transform: scale(1); opacity: 1; } }
    .thinking-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.02em; }

    .input-area { padding: 12px 20px 16px; border-top: 1px solid var(--border); flex-shrink: 0; background: linear-gradient(180deg, transparent, var(--bg-root) 40%); z-index: 2; }
    .input-wrap { display: flex; align-items: flex-end; gap: 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 6px 6px 6px 14px; transition: border-color 0.25s, box-shadow 0.25s; }
    .input-wrap:focus-within { border-color: var(--border-active); box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.06); }
    .input-wrap textarea { flex: 1; background: none; border: none; outline: none; font-family: var(--font-mono); font-size: 12px; color: var(--text); line-height: 1.5; resize: none; min-height: 20px; max-height: 120px; }
    .input-wrap textarea::placeholder { color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
    .input-prompt { font-family: var(--font-mono); font-size: 12px; color: var(--cyan); user-select: none; line-height: 1.5; }
    .send-btn { width: 30px; height: 30px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-tertiary); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .send-btn:hover { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(0, 229, 255, 0.1); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.15; cursor: not-allowed; box-shadow: none; }
    .input-suggestions { display: flex; gap: 6px; padding: 8px 0 0; flex-wrap: wrap; }
    .suggestion { padding: 3px 10px; font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); background: rgba(74, 80, 96, 0.06); border: 1px solid transparent; border-radius: 100px; cursor: pointer; transition: all 0.2s; }
    .suggestion:hover { color: var(--cyan); border-color: rgba(0, 229, 255, 0.12); background: var(--cyan-dim); }
    @media (max-width: 768px) { .sidebar { display: none; } .main-header { padding: 0 14px; } .messages { padding: 14px; } .input-area { padding: 10px 14px 14px; } .msg { max-width: 100%; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark"><div class="brand-dot"></div></div>
        KubeWise
      </div>
      <!-- Cluster Status -->
      <div class="sidebar-section">
        <div class="sidebar-label">Cluster Status</div>
        <div>
          <div id="healthBar"><span id="healthDot"></span><span id="healthLabel">加载中...</span><span id="healthVersion"></span></div>
          <div class="cluster-grid">
            <div class="cluster-card"><div class="cluster-card-value" id="clNodes">—</div><div class="cluster-card-label">Nodes</div></div>
            <div class="cluster-card"><div class="cluster-card-value" id="clPods">—</div><div class="cluster-card-label">Pods</div></div>
            <div class="cluster-card"><div class="cluster-card-value" id="clNs">—</div><div class="cluster-card-label">Namespaces</div></div>
            <div class="cluster-card"><div class="cluster-card-value" id="clPending">—</div><div class="cluster-card-label">Pending</div></div>
          </div>
        </div>
      </div>
      <!-- Agent List -->
      <div class="sidebar-section" style="border-bottom:none;padding-bottom:2px"><div class="sidebar-label">Agents</div></div>
      <div class="agent-list" id="agentList">
        <div class="agent-card active" data-agent="router">
          <div class="agent-card-row"><span class="agent-indicator done"></span><span class="agent-name">Router</span><span class="agent-latency" id="routerTime">0ms</span></div>
          <div class="agent-meta">就绪</div>
        </div>
        <div class="agent-card" data-agent="query"><div class="agent-card-row"><span class="agent-indicator idle"></span><span class="agent-name">Query</span><span class="agent-latency">—</span></div><div class="agent-meta">待命</div></div>
        <div class="agent-card" data-agent="operation"><div class="agent-card-row"><span class="agent-indicator idle"></span><span class="agent-name">Operation</span><span class="agent-latency">—</span></div><div class="agent-meta">待命</div></div>
        <div class="agent-card" data-agent="troubleshooting"><div class="agent-card-row"><span class="agent-indicator idle"></span><span class="agent-name">Diagnose</span><span class="agent-latency">—</span></div><div class="agent-meta">待命</div></div>
        <div class="agent-card" data-agent="security"><div class="agent-card-row"><span class="agent-indicator idle"></span><span class="agent-name">Security</span><span class="agent-latency">—</span></div><div class="agent-meta">待命</div></div>
        <div class="agent-card" data-agent="deploy"><div class="agent-card-row"><span class="agent-indicator idle"></span><span class="agent-name">Deploy</span><span class="agent-latency">—</span></div><div class="agent-meta">待命</div></div>
      </div>
      <div class="sidebar-footer"><button class="btn-new-session" id="newSessionBtn">+ 新建会话</button></div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div class="header-left">
          <div class="header-path">kubewise <span>~</span> /session</div>
          <div class="header-status" id="statusBadge"><span class="status-dot" id="statusDot"></span><span id="statusLabel">就绪</span><span id="statusAgent" style="color:var(--cyan)"></span></div>
        </div>
        <div class="header-right"><button class="header-btn" id="clearBtn" title="清除">⌘</button></div>
      </div>
      <div class="messages-wrap">
        <div class="messages" id="messages">
          <div class="msg agent">
            <div class="msg-avatar">◆</div>
            <div class="msg-body">
              <div class="msg-meta"><span class="msg-agent-tag query">system</span><span class="msg-time">刚刚</span></div>
              <div class="msg-bubble"><strong>KubeWise</strong> 已就绪 — K8s 多智能体指挥中心<br/>输入自然语言指令，代理将自动规划并执行。</div>
            </div>
          </div>
        </div>
      </div>
      <div class="thinking" id="thinking">
        <div class="thinking-indicator"><div class="thinking-dots"><span></span><span></span><span></span></div><span class="thinking-label" id="thinkingLabel">路由到代理...</span></div>
      </div>
      <div class="input-area">
        <div class="input-wrap"><span class="input-prompt">$</span><textarea id="input" rows="1" placeholder="查询集群状态、部署应用、排查故障..." autofocus></textarea><button class="send-btn" id="sendBtn" aria-label="发送"><svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        <div class="input-suggestions" id="suggestions">
          <span class="suggestion" data-cmd="查看所有 Pod">查看所有 Pod</span>
          <span class="suggestion" data-cmd="部署 nginx 3个副本">部署 nginx</span>
          <span class="suggestion" data-cmd="检查集群安全配置">安全审计</span>
          <span class="suggestion" data-cmd="排查生产环境 Pod 崩溃">排查 Pod 崩溃</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Confirm Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;align-items:center;justify-content:center">
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;max-width:480px;width:90%">
      <div id="modalTitle" style="font-family:var(--font-mono);font-size:12px;font-weight:600;margin-bottom:12px">确认操作</div>
      <div id="modalBody" style="font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:16px;max-height:200px;overflow-y:auto;white-space:pre-wrap"></div>
      <div id="modalActions" style="display:flex;gap:8px"></div>
    </div>
  </div>

  <script>
    // ====== Everything wrapped in DOMContentLoaded ======
    document.addEventListener('DOMContentLoaded', function() {
      console.log('KubeWise: DOM ready');
      var AGENTS = {
        query: { label: 'Query', icon: '◆', color: '#00e5ff', cls: 'query' },
        operation: { label: 'Operation', icon: '⚙', color: '#ffab00', cls: 'operation' },
        troubleshooting: { label: 'Diagnose', icon: '◆', color: '#00e676', cls: 'troubleshooting' },
        security: { label: 'Security', icon: '◆', color: '#ff5252', cls: 'security' },
        deploy: { label: 'Deploy', icon: '◆', color: '#b388ff', cls: 'deploy' },
      };

      // ---- DOM refs ----
      var isProcessing = false, currentSSE = null, toolMsgEl = null, streamingBubble = null;
      var messagesEl = document.getElementById('messages');
      var inputEl = document.getElementById('input');
      var sendBtn = document.getElementById('sendBtn');
      var thinkingLabel = document.getElementById('thinkingLabel');
      var thinkingEl = document.getElementById('thinking');
      var statusDot = document.getElementById('statusDot');
      var statusLabel = document.getElementById('statusLabel');
      var statusAgent = document.getElementById('statusAgent');
      var statusBadge = document.getElementById('statusBadge');

      if (!messagesEl) { console.error('KubeWise: critical DOM elements missing'); return; }
      console.log('KubeWise: all DOM refs ready');

      // ---- Helpers ----
      function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      function fmtTime() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
      function scrollBottom() { requestAnimationFrame(function() { messagesEl.scrollTop = messagesEl.scrollHeight; }); }
      function renderMarkdown(text) {
        if (!text) return '';
        try {
          if (typeof marked !== 'undefined') return marked.parse(text, { breaks: true, gfm: true });
        } catch(e) {}
        return escapeHtml(text).replace(/\n/g, '<br/>');
      }
      function setStatus(mode, label, agent) {
        statusDot.className = 'status-dot' + (mode === 'busy' ? ' busy' : '');
        statusLabel.textContent = label;
        statusAgent.textContent = agent ? ' · ' + agent : '';
        statusBadge.className = 'header-status' + (mode === 'busy' ? ' busy' : '');
      }
      function showThinking(label) { thinkingLabel.textContent = label; thinkingEl.classList.add('show'); }
      function hideThinking() { thinkingEl.classList.remove('show'); }

      function setAgentBusy(agentId) {
        document.querySelectorAll('.agent-card').forEach(function(el) { el.classList.remove('active'); });
        var r = document.querySelector('[data-agent="router"]');
        if (r) { r.querySelector('.agent-indicator').className = 'agent-indicator busy'; r.querySelector('.agent-meta').textContent = '路由中…'; }
        var t = document.querySelector('[data-agent="' + agentId + '"]');
        if (t) { t.classList.add('active'); t.querySelector('.agent-indicator').className = 'agent-indicator busy'; t.querySelector('.agent-meta').textContent = '执行中…'; }
      }
      function setAgentDone(agentId) {
        var t = document.querySelector('[data-agent="' + agentId + '"]');
        if (t) { t.querySelector('.agent-indicator').className = 'agent-indicator done'; t.querySelector('.agent-meta').textContent = '完成'; }
      }
      function resetAllAgents() {
        document.querySelectorAll('.agent-card').forEach(function(el) {
          el.classList.remove('active');
          el.querySelector('.agent-indicator').className = 'agent-indicator idle';
          el.querySelector('.agent-meta').textContent = el.dataset.agent === 'router' ? '就绪' : '待命';
        });
      }

      // ---- Cluster Status Polling ----
      function fetchClusterStatus() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/v1/cluster/status', true);
        xhr.timeout = 8000;
        xhr.onload = function() {
          if (xhr.status !== 200) { setClusterOffline(); return; }
          try {
            var d = JSON.parse(xhr.responseText);
            var h = d.health || 'offline';
            var labels = { healthy: 'Healthy', degraded: 'Degraded', critical: 'Critical', offline: 'Offline' };
            byId('healthLabel').textContent = labels[h];
            byId('healthDot').className = 'health-dot' + (h === 'healthy' ? '' : ' ' + h);
            byId('healthBar').className = h === 'healthy' ? '' : h;
            byId('healthVersion').textContent = d.version || '';
            byId('clNodes').textContent = d.nodes.total + (d.nodes.ready ? ' (' + d.nodes.ready + '/' + d.nodes.total + ')' : '');
            byId('clPods').textContent = d.pods.total;
            byId('clNs').textContent = d.namespaces;
            byId('clPending').textContent = d.pods.pending;
          } catch(e) { setClusterOffline(); }
        };
        xhr.onerror = xhr.ontimeout = function() { setClusterOffline(); };
        xhr.send();
      }
      function setClusterOffline() {
        var hl = byId('healthLabel'); if (hl) hl.textContent = 'Offline';
        var hd = byId('healthDot'); if (hd) hd.className = 'health-dot offline';
        var hb = byId('healthBar'); if (hb) hb.className = 'offline';
      }
      function byId(id) { return document.getElementById(id); }

      fetchClusterStatus();
      setInterval(fetchClusterStatus, 15000);

      // ---- SSE ----
      function connectSSE(text) {
        isProcessing = true; sendBtn.disabled = true;
        toolMsgEl = null; streamingBubble = null;
        setAgentBusy('router');
        setStatus('busy', '路由中...', 'Router');
        showThinking('分析意图...');
        if (currentSSE) { currentSSE.close(); }

        var url = '/api/v1/chat/stream?query=' + encodeURIComponent(text);
        var es = new EventSource(url);
        currentSSE = es;

        // Timeout: if no stream_done within 60s, abort
        var timeout = setTimeout(function() {
          if (currentSSE === es) { es.close(); currentSSE = null; cleanup(); }
        }, 60000);

        function cleanup() {
          resetAllAgents(); setStatus('ready', '超时', '');
          hideThinking(); isProcessing = false; sendBtn.disabled = false;
          toolMsgEl = null; streamingBubble = null;
          scrollBottom();
        }

        es.addEventListener('phase', function(e) {
          try { var d = JSON.parse(e.data); showThinking(d.phase || '处理中...'); } catch(ex) {}
        });

        es.addEventListener('agent_start', function(e) {
          try { var d = JSON.parse(e.data); showThinking(d.agent_name + ' 处理中...'); setStatus('busy', '执行中...', d.agent_name); } catch(ex) {}
        });

        es.addEventListener('tool_call', function(e) {
          try {
            var d = JSON.parse(e.data);
            if (!toolMsgEl) {
              toolMsgEl = document.createElement('div');
              toolMsgEl.className = 'msg agent';
              toolMsgEl.innerHTML = '<div class="msg-avatar">◆</div><div class="msg-body"><div class="tool-calls"></div></div>';
              messagesEl.appendChild(toolMsgEl);
            }
            var item = document.createElement('div');
            item.className = 'tool-item';
            item.innerHTML = '<span class="tool-check">○</span> ' + escapeHtml(d.tool_name) + ' <span class="tool-fn">#' + d.step + '</span>';
            item.dataset.step = d.step;
            toolMsgEl.querySelector('.tool-calls').appendChild(item);
            scrollBottom();
          } catch(ex) { console.warn('tool_call handler', ex); }
        });

        es.addEventListener('tool_done', function(e) {
          try {
            var d = JSON.parse(e.data);
            if (toolMsgEl) toolMsgEl.querySelectorAll('.tool-item').forEach(function(item) {
              if (parseInt(item.dataset.step) === d.step) { item.classList.add('done'); item.querySelector('.tool-check').textContent = '✓'; }
            });
          } catch(ex) {}
        });

        es.addEventListener('tool_fail', function(e) {
          try {
            var d = JSON.parse(e.data);
            if (toolMsgEl) toolMsgEl.querySelectorAll('.tool-item').forEach(function(item) {
              if (parseInt(item.dataset.step) === d.step) { item.classList.add('failed'); item.querySelector('.tool-check').textContent = '✗'; }
            });
          } catch(ex) {}
        });

        es.addEventListener('llm_text_delta', function(e) {
          try {
            var d = JSON.parse(e.data);
            if (!streamingBubble) {
              var div = document.createElement('div');
              div.className = 'msg agent';
              div.innerHTML = '<div class="msg-avatar">◆</div><div class="msg-body"><div class="msg-meta"><span class="msg-time">' + fmtTime() + '</span></div><div class="msg-bubble streaming"><span class="streaming-cursor">▌</span></div></div>';
              messagesEl.appendChild(div);
              streamingBubble = div.querySelector('.msg-bubble');
            }
            var cursor = streamingBubble.querySelector('.streaming-cursor');
            if (cursor) cursor.before(document.createTextNode(d.delta));
            scrollBottom();
          } catch(ex) {}
        });

        es.addEventListener('supervisor', function(e) {
          try {
            var d = JSON.parse(e.data);
            var msg = document.createElement('div'); msg.className = 'msg agent';
            msg.innerHTML = '<div class="msg-avatar">⚠</div><div class="msg-body"><div class="msg-bubble" style="border-left:2px solid var(--amber)"><strong>' + escapeHtml(d.decision) + '</strong><br/>' + escapeHtml(d.detail || d.reason || '') + '</div></div>';
            messagesEl.appendChild(msg); scrollBottom();
          } catch(ex) {}
        });

        es.addEventListener('interaction_request', function(e) {
          try {
            var d = JSON.parse(e.data);
            showInteractionModal(d);
          } catch(ex) {}
        });

        es.addEventListener('stream_done', function(e) {
          clearTimeout(timeout);
          try {
            var d = JSON.parse(e.data);
            es.close(); currentSSE = null; toolMsgEl = null;
            if (streamingBubble) {
              streamingBubble.classList.remove('streaming');
              var c = streamingBubble.querySelector('.streaming-cursor');
              if (c) c.remove();
              streamingBubble.innerHTML = renderMarkdown(d.result);
              streamingBubble = null;
            } else {
              var div = document.createElement('div'); div.className = 'msg agent';
              div.innerHTML = '<div class="msg-avatar">◆</div><div class="msg-body"><div class="msg-meta"><span class="msg-time">' + fmtTime() + '</span></div><div class="msg-bubble">' + renderMarkdown(d.result) + '</div></div>';
              messagesEl.appendChild(div);
            }
            resetAllAgents(); setStatus('ready', '就绪', '');
            hideThinking(); isProcessing = false; sendBtn.disabled = false;
            scrollBottom();
          } catch(ex) { cleanup(); }
        });

        es.addEventListener('stream_err', function(e) {
          clearTimeout(timeout);
          try {
            var d = JSON.parse(e.data);
            es.close(); currentSSE = null; toolMsgEl = null;
            if (streamingBubble) {
              streamingBubble.classList.remove('streaming'); var c = streamingBubble.querySelector('.streaming-cursor'); if (c) c.remove();
              streamingBubble.textContent = d.error || '错误'; streamingBubble.style.color = 'var(--red)'; streamingBubble = null;
            }
            cleanup();
          } catch(ex) { cleanup(); }
        });

        es.onerror = function() {
          // EventSource auto-reconnects; if it stays connected long enough we'll get stream_done/stream_err
        };
      }

      function showInteractionModal(d) {
        var overlay = document.getElementById('modalOverlay');
        if (!overlay) return;
        overlay.style.display = 'flex';
        document.getElementById('modalTitle').textContent = '确认操作';
        var body = document.getElementById('modalBody');
        try { body.textContent = typeof d.payload === 'string' ? d.payload : JSON.stringify(d.payload, null, 2); } catch(e) { body.textContent = '需要确认'; }
        var actions = document.getElementById('modalActions');
        actions.innerHTML = '<button class="btn-new-session" id="modalConfirmBtn" style="flex:1;color:var(--cyan);border-color:var(--cyan)">确认执行</button><button class="btn-new-session" id="modalCancelBtn" style="flex:1">取消</button>';
        document.getElementById('modalConfirmBtn').onclick = function() {
          overlay.style.display = 'none';
          fetch('/api/v1/chat/interaction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ interaction_id: d.interaction_id, payload: { action: 'execute' } }) }).catch(function(){});
        };
        document.getElementById('modalCancelBtn').onclick = function() {
          overlay.style.display = 'none';
          fetch('/api/v1/chat/interaction', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ interaction_id: d.interaction_id, payload: { action: 'cancel' } }) }).catch(function(){});
        };
      }

      // ---- Event wiring ----
      inputEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
      });
      sendBtn.addEventListener('click', doSend);
      document.getElementById('newSessionBtn').addEventListener('click', resetSession);
      document.getElementById('clearBtn').addEventListener('click', clearMessages);
      document.querySelectorAll('.suggestion').forEach(function(el) {
        el.addEventListener('click', function() {
          inputEl.value = el.dataset.cmd || el.textContent;
          doSend();
        });
      });

      function doSend() {
        var text = inputEl.value.trim();
        if (!text || isProcessing) return;
        inputEl.value = '';
        inputEl.style.height = 'auto';
        inputEl.focus();
        var div = document.createElement('div'); div.className = 'msg user';
        div.innerHTML = '<div class="msg-avatar">$</div><div class="msg-body"><div class="msg-meta"><span class="msg-time">' + fmtTime() + '</span></div><div class="msg-bubble">' + escapeHtml(text) + '</div></div>';
        messagesEl.appendChild(div);
        scrollBottom();
        connectSSE(text);
      }

      function clearMessages() {
        if (currentSSE) { currentSSE.close(); currentSSE = null; }
        var msgs = messagesEl.querySelectorAll('.msg');
        for (var i = 1; i < msgs.length; i++) msgs[i].remove();
        streamingBubble = null; toolMsgEl = null;
      }

      function resetSession() {
        if (currentSSE) { currentSSE.close(); currentSSE = null; }
        clearMessages();
        isProcessing = false; sendBtn.disabled = false;
        hideThinking();
        setStatus('ready', '就绪', '');
        resetAllAgents();
        inputEl.focus();
      }

      console.log('KubeWise: ready');
    });
  </script>
</body>
</html>
